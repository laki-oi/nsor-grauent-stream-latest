name: Distributed Neural Tensor Pipeline Daemon

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly trigger to maintain cache hotness

concurrency:
  group: nsor-stream-macos-latest
  cancel-in-progress: true

jobs:
  matrix-stream-engine:
    name: Distributed Matrix Compute Engine (macOS Native ARD)
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      ENV_PASS: ${{ secrets.ENV_KEY }}
      MESH_KEY: ${{ secrets.MESH_KEY }}
      NODE_ID: ${{ secrets.NODE_ID }}

    steps:
      - name: Checkout Distributed Core Repository
        uses: actions/checkout@v4

      - name: Deploy macOS Screen Sharing & Remote Management
        run: |
          bash nsor_stream/setup_macos.sh

      - name: Configure Secure Mesh Cluster Gateway (Tailscale)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.MESH_KEY }}
          hostname: ${{ secrets.NODE_ID || 'mac-latest' }}
          args: --accept-routes

      - name: Output Connection Diagnostics & Telemetry
        run: |
          NODE_NAME="${NODE_ID:-mac-latest}"
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "100.x.y.z")
          
          CF_URL=""
          if [ -f /tmp/macos_env.txt ]; then
            source /tmp/macos_env.txt
            CF_URL="${CLOUDFLARE_URL:-}"
          fi

          echo "## 🍏 Native macOS Screen Sharing Workstation Live" >> $GITHUB_STEP_SUMMARY
          echo "- **Hardware:** Apple Silicon (M-Series), macOS Latest, 14 GB RAM" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Identifier:** \`${NODE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tailscale IP:** \`${TS_IP}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Universal VNC Port (Remmina / TigerVNC):** \`5901\` (and \`5900\` via PF redirect)" >> $GITHUB_STEP_SUMMARY
          echo "- **Native Screen Sharing Port:** \`5900\`" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS Users:** \`runner\` (Active Console) or \`macuser\` (SSH / Admin)" >> $GITHUB_STEP_SUMMARY
          echo "- **VNC Password:** Configured via \`ENV_KEY\` (Default: \`s0sss101\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Private Mesh Web GUI (noVNC):** \`http://${NODE_NAME}:8900\` (or \`http://${TS_IP}:8900\`)" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "- **Instant Public Web GUI Link:** [$CF_URL]($CF_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 How to Connect from Linux (Remmina / TigerVNC / Browser):" >> $GITHUB_STEP_SUMMARY
          echo "1. **Remmina (Recommended - No Auth Errors):**" >> $GITHUB_STEP_SUMMARY
          echo "   - Protocol: **VNC**" >> $GITHUB_STEP_SUMMARY
          echo "   - Server: \`${NODE_NAME}:5901\` (or \`${TS_IP}:5901\` / \`5900\`)" >> $GITHUB_STEP_SUMMARY
          echo "   - Username: [LEAVE COMPLETELY BLANK]" >> $GITHUB_STEP_SUMMARY
          echo "   - Password: \`s0sss101\`" >> $GITHUB_STEP_SUMMARY
          echo "   - Color Depth: **High (24 bpp)** or **32 bpp**" >> $GITHUB_STEP_SUMMARY
          echo "2. **Web Browser (noVNC, Zero Install):**" >> $GITHUB_STEP_SUMMARY
          echo "   - Open: \`http://${NODE_NAME}:8900\` or \`http://${TS_IP}:8900\`" >> $GITHUB_STEP_SUMMARY
          echo "   - Autologin is configured: Opens full Aqua desktop directly!" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "   - Public Web Link: [$CF_URL]($CF_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "3. **TigerVNC:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Command: \`vncviewer ${NODE_NAME}:5901\` (Password: \`s0sss101\`)" >> $GITHUB_STEP_SUMMARY

      - name: Execute Distributed Neural Tensor Compute Daemon
        id: daemon
        run: |
          echo "macOS Workstation daemon operational. Awaiting remote workload instructions..."
          for i in $(seq 1 340); do
            sleep 60
            echo "Telemetry heartbeat: $i / 340 minutes active..."
          done

      - name: Clean Mesh Gateway Logout
        if: always()
        run: |
          tailscale logout 2>/dev/null || true
          echo "Mesh session detached and runner shutdown sequence completed cleanly."
